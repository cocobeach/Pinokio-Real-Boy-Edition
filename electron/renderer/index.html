<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinokio: Command Center</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
    }

    /* Window Title Bar (Epic 10.1) */
    #window-titlebar {
      height: 32px;
      width: 100%;
      background: linear-gradient(180deg, #2d2d2d 0%, #252526 100%);
      border-bottom: 1px solid #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      -webkit-app-region: drag;
      user-select: none;
      flex-shrink: 0;
    }

    #window-titlebar .title-content {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #cccccc;
      font-weight: 500;
    }

    #window-titlebar .title-icon {
      font-size: 16px;
    }

    #window-titlebar .window-controls {
      display: flex;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    #window-titlebar .window-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s ease;
      color: #cccccc;
    }

    #window-titlebar .window-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    #window-titlebar .window-btn.close:hover {
      background: #e81123;
      color: white;
    }

    #command-center-shell {
      display: flex;
      height: calc(100vh - 32px);
      width: 100vw;
    }

    /* LEFT PANE: Native Sidebar */
    #native-sidebar {
      width: 60px;
      min-width: 60px;
      background: linear-gradient(180deg, #2d2d2d 0%, #1a1a1a 100%);
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
      z-index: 100;
    }

    #native-sidebar .nav-icon {
      width: 40px;
      height: 40px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease;
      font-size: 24px;
      position: relative;
      -webkit-app-region: no-drag;
    }

    #native-sidebar .nav-icon:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    #native-sidebar .nav-icon.active {
      background: rgba(59, 130, 246, 0.3);
      border: 1px solid rgba(59, 130, 246, 0.5);
    }

    #native-sidebar .nav-icon .badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #ef4444;
      color: white;
      font-size: 10px;
      font-weight: 600;
      min-width: 16px;
      height: 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }

    /* RIGHT PANEL: Info Sidebar (Epic 9) */
    #info-sidebar {
      width: 320px;
      min-width: 320px;
      background: linear-gradient(180deg, #252526 0%, #1e1e1e 100%);
      border-left: 1px solid #333;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      transform: translateX(0);
      transition: transform 0.3s ease;
      z-index: 90;
    }

    #info-sidebar.collapsed {
      transform: translateX(320px);
    }

    #info-sidebar .sidebar-header {
      height: 48px;
      background: #2d2d2d;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
    }

    #info-sidebar .sidebar-header .title {
      font-size: 13px;
      font-weight: 600;
      color: #cccccc;
    }

    #info-sidebar .sidebar-header .collapse-btn {
      cursor: pointer;
      font-size: 18px;
      opacity: 0.7;
      transition: opacity 0.2s;
      -webkit-app-region: no-drag;
    }

    #info-sidebar .sidebar-header .collapse-btn:hover {
      opacity: 1;
    }

    /* Widget Styles */
    .widget {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      margin: 12px;
      padding: 16px;
    }

    .widget-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .widget-title .refresh-btn {
      cursor: pointer;
      font-size: 14px;
      opacity: 0.5;
      transition: opacity 0.2s;
      -webkit-app-region: no-drag;
    }

    .widget-title .refresh-btn:hover {
      opacity: 1;
    }

    /* Git Status Widget */
    .git-branch {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
    }

    .git-branch .branch-icon {
      font-size: 16px;
    }

    .git-branch .branch-name {
      font-size: 13px;
      font-weight: 500;
      color: #4ec9b0;
      font-family: 'Courier New', monospace;
    }

    .git-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      font-size: 11px;
    }

    .git-stat {
      padding: 6px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      text-align: center;
    }

    .git-stat .count {
      font-size: 16px;
      font-weight: 600;
      display: block;
      margin-bottom: 2px;
    }

    .git-stat.staged .count { color: #10b981; }
    .git-stat.modified .count { color: #f59e0b; }
    .git-stat.untracked .count { color: #6b7280; }

    .git-stat .label {
      font-size: 10px;
      color: #888;
      text-transform: uppercase;
    }

    /* Task List Widget */
    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      border-left: 3px solid #6b7280;
      transition: all 0.2s;
    }

    .task-item.completed {
      border-left-color: #10b981;
      opacity: 0.7;
    }

    .task-item.in-progress {
      border-left-color: #3b82f6;
      animation: pulse 2s infinite;
    }

    .task-item.failed {
      border-left-color: #ef4444;
    }

    .task-item .task-icon {
      font-size: 16px;
      margin-top: 2px;
    }

    .task-item .task-content {
      flex: 1;
    }

    .task-item .task-id {
      font-size: 10px;
      color: #888;
      text-transform: uppercase;
    }

    .task-item .task-desc {
      font-size: 12px;
      color: #cccccc;
      margin-top: 4px;
      line-height: 1.4;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* Hardware Widget */
    .hardware-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
    }

    .hardware-item .hw-label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .hardware-item .hw-value {
      font-size: 13px;
      font-weight: 600;
      color: #cccccc;
      font-family: 'Courier New', monospace;
    }

    .hardware-bar {
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }

    .hardware-bar .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #3b82f6);
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    .hardware-bar .bar-fill.warning {
      background: linear-gradient(90deg, #f59e0b, #ef4444);
    }

    .empty-state {
      text-align: center;
      padding: 24px 12px;
      color: #666;
      font-size: 12px;
    }

    .empty-state .icon {
      font-size: 32px;
      margin-bottom: 8px;
      opacity: 0.5;
    }

    /* MIDDLE PANE: Web App + Terminal */
    #middle-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Webview Container */
    #pinokiod-webview {
      width: 100%;
      flex: 1;
      border: none;
      background: #fff;
    }

    /* Terminal Drawer */
    #terminal-drawer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 0;
      background: #1e1e1e;
      border-top: 1px solid #333;
      transition: height 0.3s ease;
      overflow: hidden;
      z-index: 50;
    }

    #terminal-drawer.open {
      height: 40vh;
    }

    #terminal-drawer.maximized {
      height: 100%;
    }

    #terminal-header {
      height: 36px;
      background: #252526;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      cursor: move;
      user-select: none;
    }

    #terminal-header .title {
      font-size: 12px;
      font-weight: 500;
      color: #cccccc;
    }

    #terminal-header .controls {
      display: flex;
      gap: 8px;
    }

    #terminal-header .control-btn {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s ease;
      -webkit-app-region: no-drag;
    }

    #terminal-header .control-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    #terminal-content {
      height: calc(100% - 36px);
      padding: 12px;
      overflow: auto;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.5;
    }

    /* Loading State */
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading-overlay .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(59, 130, 246, 0.2);
      border-top-color: rgba(59, 130, 246, 0.8);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    #loading-overlay .loading-text {
      margin-top: 20px;
      font-size: 14px;
      color: #888;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Utility */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- Window Title Bar (Epic 10.1) -->
  <div id="window-titlebar">
    <div class="title-content">
      <span class="title-icon">🤖</span>
      <span>Pinokio: Real Boy Edition</span>
    </div>
    <div class="window-controls">
      <div class="window-btn minimize" id="window-minimize" title="Minimize">−</div>
      <div class="window-btn maximize" id="window-maximize" title="Maximize">□</div>
      <div class="window-btn close" id="window-close" title="Close">×</div>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Initializing Pinokio Command Center...</div>
  </div>

  <!-- Command Center Shell -->
  <div id="command-center-shell">
    <!-- LEFT: Native Sidebar -->
    <div id="native-sidebar">
      <div class="nav-icon active" id="nav-home" title="Home">🏠</div>
      <div class="nav-icon" id="nav-info" title="Info Panel">📊
        <span class="badge hidden" id="task-badge">0</span>
      </div>
      <div class="nav-icon" id="nav-terminal" title="Terminal">⌨️</div>
      <div class="nav-icon" id="nav-settings" title="Settings">⚙️</div>
    </div>

    <!-- MIDDLE: Web App + Terminal Drawer -->
    <div id="middle-stage">
      <!-- Pinokiod Web App -->
      <webview
        id="pinokiod-webview"
        src="about:blank"
        allowpopups
        nodeintegration="false"
        webpreferences="contextIsolation=true"
      ></webview>

      <!-- Terminal Drawer (Hidden by default) -->
      <div id="terminal-drawer">
        <div id="terminal-header">
          <div class="title">Terminal</div>
          <div class="controls">
            <div class="control-btn" id="terminal-minimize" title="Minimize">−</div>
            <div class="control-btn" id="terminal-maximize" title="Maximize">□</div>
            <div class="control-btn" id="terminal-close" title="Close">×</div>
          </div>
        </div>
        <div id="terminal-content">
          <div style="color: #888;">Terminal ready. Waiting for session...</div>
        </div>
      </div>
    </div>

    <!-- RIGHT: Info Sidebar (Epic 9) -->
    <div id="info-sidebar" class="collapsed">
      <div class="sidebar-header">
        <div class="title">📊 Command Center</div>
        <div class="collapse-btn" id="sidebar-collapse">❮</div>
      </div>

      <!-- Git Status Widget -->
      <div class="widget" id="git-widget">
        <div class="widget-title">
          <span>🌿 Git Status</span>
          <span class="refresh-btn" id="refresh-git" title="Refresh">↻</span>
        </div>
        <div id="git-content">
          <div class="empty-state">
            <div class="icon">🔍</div>
            <div>No Git repository detected</div>
          </div>
        </div>
      </div>

      <!-- Active Plan Widget -->
      <div class="widget" id="plan-widget">
        <div class="widget-title">
          <span>📋 Active Plan</span>
          <span class="refresh-btn" id="refresh-plan" title="Refresh">↻</span>
        </div>
        <div id="plan-content">
          <div class="empty-state">
            <div class="icon">📝</div>
            <div>No active plan</div>
          </div>
        </div>
      </div>

      <!-- Hardware Widget -->
      <div class="widget" id="hardware-widget">
        <div class="widget-title">
          <span>💻 Hardware</span>
          <span class="refresh-btn" id="refresh-hardware" title="Refresh">↻</span>
        </div>
        <div id="hardware-content">
          <div class="empty-state">
            <div class="icon">⏳</div>
            <div>Loading...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    console.log('[Command Center] Initializing...');

    // Get URL parameters passed from main process
    const urlParams = new URLSearchParams(window.location.search);
    const rootUrl = urlParams.get('rootUrl') || 'http://localhost:3000';

    console.log('[Command Center] Root URL:', rootUrl);

    // Elements
    const webview = document.getElementById('pinokiod-webview');
    const terminalDrawer = document.getElementById('terminal-drawer');
    const terminalContent = document.getElementById('terminal-content');
    const loadingOverlay = document.getElementById('loading-overlay');
    const infoSidebar = document.getElementById('info-sidebar');
    const taskBadge = document.getElementById('task-badge');

    // Wait for webview to be ready
    webview.addEventListener('dom-ready', () => {
      console.log('[Command Center] Webview DOM ready');
      setTimeout(() => {
        loadingOverlay.classList.add('hidden');
      }, 500);
    });

    webview.addEventListener('did-fail-load', (event) => {
      console.error('[Command Center] Webview failed to load:', event);
      terminalContent.innerHTML = `<div style="color: #ff6b6b;">Failed to load Pinokio server at ${rootUrl}</div>`;
    });

    // CRITICAL: Comprehensive webview debugging event listeners
    webview.addEventListener('did-start-loading', () => {
      console.log('[Webview] 🔄 Start loading:', rootUrl);
    });

    webview.addEventListener('did-stop-loading', () => {
      console.log('[Webview] ✅ Stop loading - Success!');
    });

    webview.addEventListener('did-fail-load', (e) => {
      console.error('[Webview] ❌ FAIL:', e.errorDescription, 'Code:', e.errorCode, 'URL:', e.validatedURL);
      // Show error in terminal for user visibility
      if (terminalContent) {
        terminalContent.innerHTML += `<div style="color: #ff6b6b;">[Webview Load Fail] ${e.errorDescription} (Code: ${e.errorCode})</div>`;
      }
    });

    webview.addEventListener('console-message', (e) => {
      console.log('[Webview Console]:', e.message);
    });

    webview.addEventListener('crashed', () => {
      console.error('[Webview] 💥 CRASHED! Renderer process died.');
    });

    webview.addEventListener('unresponsive', () => {
      console.warn('[Webview] ⚠️  UNRESPONSIVE - Page taking too long to respond.');
    });

    webview.addEventListener('responsive', () => {
      console.log('[Webview] ✅ RESPONSIVE again - Page recovered.');
    });

    // Load the Pinokio web app
    console.log('[Command Center] Loading webview:', rootUrl);
    webview.src = rootUrl;

    // Terminal Drawer Controls
    let terminalState = 'closed';

    function openTerminal() {
      terminalDrawer.classList.add('open');
      terminalDrawer.classList.remove('maximized');
      terminalState = 'open';
    }

    function maximizeTerminal() {
      terminalDrawer.classList.add('maximized');
      terminalDrawer.classList.add('open');
      terminalState = 'maximized';
    }

    function minimizeTerminal() {
      terminalDrawer.classList.remove('maximized');
      terminalDrawer.classList.add('open');
      terminalState = 'open';
    }

    function closeTerminal() {
      terminalDrawer.classList.remove('open', 'maximized');
      terminalState = 'closed';
    }

    document.getElementById('terminal-minimize').addEventListener('click', minimizeTerminal);
    document.getElementById('terminal-maximize').addEventListener('click', () => {
      if (terminalState === 'maximized') {
        minimizeTerminal();
      } else {
        maximizeTerminal();
      }
    });
    document.getElementById('terminal-close').addEventListener('click', closeTerminal);

    // Info Sidebar Controls
    let sidebarState = 'collapsed';

    function toggleSidebar() {
      if (sidebarState === 'collapsed') {
        infoSidebar.classList.remove('collapsed');
        document.getElementById('sidebar-collapse').textContent = '❯';
        document.getElementById('nav-info').classList.add('active');
        sidebarState = 'open';
      } else {
        infoSidebar.classList.add('collapsed');
        document.getElementById('sidebar-collapse').textContent = '❮';
        document.getElementById('nav-info').classList.remove('active');
        sidebarState = 'collapsed';
      }
    }

    document.getElementById('nav-info').addEventListener('click', toggleSidebar);
    document.getElementById('sidebar-collapse').addEventListener('click', toggleSidebar);

    // Navigation Icons
    document.getElementById('nav-home').addEventListener('click', () => {
      console.log('[Command Center] Navigate to Home');
      webview.src = rootUrl;
    });

    document.getElementById('nav-terminal').addEventListener('click', () => {
      console.log('[Command Center] Toggle Terminal');
      if (terminalState === 'closed') {
        openTerminal();
      } else {
        closeTerminal();
      }
    });

    document.getElementById('nav-settings').addEventListener('click', () => {
      console.log('[Command Center] Navigate to Settings');
      webview.src = rootUrl + '/settings';
    });

    // === EPIC 9: SIDEBAR WIDGETS ===

    // Git Status Widget
    async function refreshGitStatus() {
      if (!window.electronAPI) return;

      try {
        // FIX: Do not use process.cwd() in renderer (security violation in Electron).
        // Pass null to let backend decide default path (~/pinokio/api)
        const gitStatus = await window.electronAPI.git.status({ path: null });

        if (!gitStatus.success || !gitStatus.status) {
          document.getElementById('git-content').innerHTML = `
            <div class="empty-state">
              <div class="icon">🔍</div>
              <div>No Git repository</div>
            </div>
          `;
          return;
        }

        const status = gitStatus.status;
        const staged = status.staged?.length || 0;
        const modified = status.modified?.length || 0;
        const untracked = status.untracked?.length || 0;

        document.getElementById('git-content').innerHTML = `
          <div class="git-branch">
            <span class="branch-icon">🌿</span>
            <span class="branch-name">${status.branch || 'main'}</span>
          </div>
          <div class="git-stats">
            <div class="git-stat staged">
              <span class="count">${staged}</span>
              <span class="label">Staged</span>
            </div>
            <div class="git-stat modified">
              <span class="count">${modified}</span>
              <span class="label">Modified</span>
            </div>
            <div class="git-stat untracked">
              <span class="count">${untracked}</span>
              <span class="label">New</span>
            </div>
          </div>
        `;
      } catch (error) {
        console.error('[Git Widget] Error:', error);
      }
    }

    // Active Plan Widget
    async function refreshActivePlan() {
      if (!window.electronAPI || !window.electronAPI.planExecutor) return;

      try {
        // Get active plans (this would need planId tracking in real implementation)
        const history = await window.electronAPI.planExecutor.history();

        if (!history.success || !history.history || history.history.length === 0) {
          document.getElementById('plan-content').innerHTML = `
            <div class="empty-state">
              <div class="icon">📝</div>
              <div>No active plan</div>
            </div>
          `;
          taskBadge.classList.add('hidden');
          return;
        }

        // Show most recent plan
        const plan = history.history[0];
        const tasks = plan.plan.tasks || [];
        const completed = plan.completedTasks?.length || 0;
        const failed = plan.failedTasks?.length || 0;
        const pending = tasks.length - completed - failed;

        // Update badge
        if (pending > 0) {
          taskBadge.textContent = pending;
          taskBadge.classList.remove('hidden');
        } else {
          taskBadge.classList.add('hidden');
        }

        let tasksHTML = '';
        tasks.forEach((task, i) => {
          const isCompleted = plan.completedTasks?.find(t => t.taskId === task.id);
          const isFailed = plan.failedTasks?.find(t => t.taskId === task.id);
          const isInProgress = i === plan.currentTaskIndex && plan.status === 'running';

          let status = 'pending';
          let icon = '⏸';
          if (isCompleted) {
            status = 'completed';
            icon = '✓';
          } else if (isFailed) {
            status = 'failed';
            icon = '✗';
          } else if (isInProgress) {
            status = 'in-progress';
            icon = '⏳';
          }

          tasksHTML += `
            <div class="task-item ${status}">
              <div class="task-icon">${icon}</div>
              <div class="task-content">
                <div class="task-id">Task ${task.id}</div>
                <div class="task-desc">${task.description}</div>
              </div>
            </div>
          `;
        });

        document.getElementById('plan-content').innerHTML = tasksHTML;
      } catch (error) {
        console.error('[Plan Widget] Error:', error);
      }
    }

    // Hardware Widget
    async function refreshHardware() {
      if (!window.electronAPI || !window.electronAPI.hardware) return;

      try {
        const hardware = await window.electronAPI.hardware.getSystem();

        if (!hardware.success) {
          document.getElementById('hardware-content').innerHTML = `
            <div class="empty-state">
              <div class="icon">❌</div>
              <div>Hardware info unavailable</div>
            </div>
          `;
          return;
        }

        let hardwareHTML = '';

        // GPUs
        if (hardware.gpu && hardware.gpu.available && hardware.gpu.devices) {
          hardware.gpu.devices.forEach((gpu, i) => {
            const usage = gpu.memory.usagePercent || 0;
            const warningClass = usage > 80 ? 'warning' : '';
            hardwareHTML += `
              <div class="hardware-item">
                <div>
                  <div class="hw-label">GPU ${i}: ${gpu.name}</div>
                  <div class="hw-value">${gpu.memory.used}MB / ${gpu.memory.total}MB</div>
                  <div class="hardware-bar">
                    <div class="bar-fill ${warningClass}" style="width: ${usage}%"></div>
                  </div>
                </div>
              </div>
            `;
          });
        }

        // CPU
        if (hardware.cpu) {
          const cpuUsage = hardware.cpu.memory.usagePercent || 0;
          hardwareHTML += `
            <div class="hardware-item">
              <div style="width: 100%;">
                <div class="hw-label">CPU</div>
                <div class="hw-value">${hardware.cpu.cores} cores @ ${hardware.cpu.speed}MHz</div>
              </div>
            </div>
          `;

          // RAM
          hardwareHTML += `
            <div class="hardware-item">
              <div style="width: 100%;">
                <div class="hw-label">RAM</div>
                <div class="hw-value">${hardware.cpu.memory.used}GB / ${hardware.cpu.memory.total}GB</div>
                <div class="hardware-bar">
                  <div class="bar-fill ${cpuUsage > 80 ? 'warning' : ''}" style="width: ${cpuUsage}%"></div>
                </div>
              </div>
            </div>
          `;
        }

        document.getElementById('hardware-content').innerHTML = hardwareHTML || `
          <div class="empty-state">
            <div class="icon">💻</div>
            <div>No hardware data</div>
          </div>
        `;
      } catch (error) {
        console.error('[Hardware Widget] Error:', error);
      }
    }

    // Refresh buttons
    document.getElementById('refresh-git').addEventListener('click', refreshGitStatus);
    document.getElementById('refresh-plan').addEventListener('click', refreshActivePlan);
    document.getElementById('refresh-hardware').addEventListener('click', refreshHardware);

    // Auto-refresh every 5 seconds
    setInterval(() => {
      if (sidebarState === 'open') {
        refreshGitStatus();
        refreshActivePlan();
        refreshHardware();
      }
    }, 5000);

    // Initial load
    setTimeout(() => {
      refreshGitStatus();
      refreshActivePlan();
      refreshHardware();
    }, 1000);

    // CRITICAL: IPC Handler for Terminal Hijack Prevention
    if (window.electronAPI && window.electronAPI.onCommandCenter) {
      console.log('[Command Center] Registering IPC handlers');

      window.electronAPI.onCommandCenter('attach-terminal', (payload) => {
        console.log('[Command Center] Terminal attach requested:', payload);

        // Open terminal drawer
        openTerminal();

        // Display terminal session info
        terminalContent.innerHTML = `
          <div style="color: #4ec9b0;">✓ Terminal session attached</div>
          <div style="color: #888; margin-top: 8px;">Session ID: ${payload.sessionId}</div>
          <div style="color: #888;">Original URL: ${payload.url}</div>
          <div style="color: #ce9178; margin-top: 12px;">Terminal Hijack Prevented!</div>
          <div style="color: #888; margin-top: 4px;">The web app tried to navigate the entire window to a log page.</div>
          <div style="color: #888;">This has been intercepted and the terminal drawer opened instead.</div>
        `;

        // TODO: When PTY integration is ready, attach to actual terminal session here
        // PTYController.attach(payload.sessionId);
      });
    } else {
      console.warn('[Command Center] electronAPI.onCommandCenter not available');
    }

    console.log('[Command Center] Initialization complete');
    console.log('[Command Center] Epic 9 Sidebar Features: Git Status, Active Plan, Hardware Monitoring');

    // === EPIC 10.1: WINDOW CONTROLS ===

    // Window control buttons
    document.getElementById('window-minimize').addEventListener('click', () => {
      console.log('[Window Controls] Minimize requested');
      if (window.electronAPI && window.electronAPI.window) {
        window.electronAPI.window.minimize();
      }
    });

    document.getElementById('window-maximize').addEventListener('click', () => {
      console.log('[Window Controls] Maximize/Restore requested');
      if (window.electronAPI && window.electronAPI.window) {
        window.electronAPI.window.maximize();
      }
    });

    document.getElementById('window-close').addEventListener('click', () => {
      console.log('[Window Controls] Close requested');
      if (window.electronAPI && window.electronAPI.window) {
        window.electronAPI.window.close();
      }
    });

    console.log('[Command Center] Epic 10.1: Window Dragging & Controls Initialized');
  </script>
</body>
</html>
